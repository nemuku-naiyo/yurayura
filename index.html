<style>
:root{
  --page:#e7eef0; --ink:#1b1b1b; --paper:#fbfbf7; --overlay:rgba(251,251,247,.93);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --page:#141a1c; } }
:root[data-theme="dark"]{ --page:#141a1c; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body{ height:100%; margin:0; background:var(--page); font-family:"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif; overscroll-behavior:none; }
#wrap{ position:relative; height:100%; max-width:480px; margin:0 auto; overflow:hidden; background:var(--paper);
  touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
canvas#game{ display:block; width:100%; height:100%; }
.screen{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:16px; background:var(--overlay); color:var(--ink); text-align:center; padding:20px; box-sizing:border-box; overflow-y:auto; }
.hidden{ display:none; }
.logo{ margin:0; }
.logo img{ display:block; width:min(58vw,250px); height:auto; }
.how{ margin:0; font-size:17px; line-height:1.8; }
.dex{ display:flex; flex-direction:column; align-items:center; gap:8px; font-size:15px; }
.dots{ display:flex; flex-wrap:wrap; justify-content:center; gap:6px; max-width:260px; }
.dot{ width:16px; height:16px; border-radius:50%; border:2px solid var(--ink); box-sizing:border-box; }
.dot.off{ background:transparent; border-style:dashed; opacity:.35; }
#card{ display:block; width:min(66vw,290px); max-height:48vh; object-fit:contain; border:3px solid var(--ink); border-radius:18px;
  -webkit-touch-callout:default; user-select:auto; -webkit-user-select:auto; pointer-events:auto; }
.note{ margin:0; font-size:14px; }
.row{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
.row button{ font-size:16px; padding:10px 16px; }
button, .btn{
  font:inherit; font-weight:600; font-size:19px; padding:11px 28px; cursor:pointer; text-decoration:none; display:inline-block;
  color:var(--ink); background:#fff; border:3px solid var(--ink); border-radius:999px; box-shadow:0 4px 0 var(--ink);
}
.ig{ color:var(--ink); font-size:14px; text-underline-offset:3px; }
.small{ font-size:15px; padding:6px 18px; box-shadow:0 3px 0 var(--ink); }
.x{ background:var(--ink) !important; color:#fff !important; }
.btn.x{ background:var(--ink); color:#fff; }
button:active, .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
button:focus-visible, .btn:focus-visible{ outline:3px dashed var(--ink); outline-offset:4px; }
</style>

// ===== 手描き風の線（整った線を歪ませる）=====
let boil = 0, boilT = 0;
function jit(x, y, s){
  const k = boil * 13.7 + s;
  return [x + Math.sin(y*0.21 + k)*0.9 + Math.sin(x*0.13 + k*1.3)*0.6,
          y + Math.sin(x*0.19 + k*0.7)*0.9 + Math.sin(y*0.11 + k*1.9)*0.6];
}
class Sk {
  constructor(seed){ this.s = seed; this.subs = []; this.cur = null; this.x = 0; this.y = 0; }
  moveTo(x, y){ this.cur = [[x, y]]; this.subs.push(this.cur); this.x = x; this.y = y; return this; }
  lineTo(x, y){
    const n = Math.max(2, Math.ceil(Math.hypot(x - this.x, y - this.y) / 6));
    for (let i = 1; i <= n; i++){ const k = i / n; this.cur.push([this.x + (x - this.x)*k, this.y + (y - this.y)*k]); }
    this.x = x; this.y = y; return this;
  }
  quad(cx, cy, x, y){
    const x0 = this.x, y0 = this.y;
    for (let i = 1; i <= 12; i++){ const k = i/12, m = 1-k; this.cur.push([m*m*x0 + 2*m*k*cx + k*k*x, m*m*y0 + 2*m*k*cy + k*k*y]); }
    this.x = x; this.y = y; return this;
  }
  bez(ax, ay, bx, by, x, y){
    const x0 = this.x, y0 = this.y;
    for (let i = 1; i <= 16; i++){ const k = i/16, m = 1-k;
      this.cur.push([m*m*m*x0 + 3*m*m*k*ax + 3*m*k*k*bx + k*k*k*x, m*m*m*y0 + 3*m*m*k*ay + 3*m*k*k*by + k*k*k*y]); }
    this.x = x; this.y = y; return this;
  }
  ellipse(cx, cy, rx, ry){
    this.moveTo(cx + rx, cy);
    for (let i = 1; i <= 24; i++){ const a = i / 24 * Math.PI * 2; this.cur.push([cx + Math.cos(a)*rx, cy + Math.sin(a)*ry]); }
    return this.close();
  }
  rect(x, y, w, h){ return this.moveTo(x, y).lineTo(x + w, y).lineTo(x + w, y + h).lineTo(x, y + h).lineTo(x, y).close(); }
  close(){ this.cur.closed = true; return this; }
  path(){
    ctx.beginPath();
    for (const sub of this.subs){
      sub.forEach((p, i) => { const q = jit(p[0], p[1], this.s); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); });
      if (sub.closed) ctx.closePath();
    }
  }
  fill(col){ this.path(); ctx.fillStyle = col; ctx.fill(); return this; }
  stroke(w){ this.path(); line(w); ctx.stroke(); return this; }
}
function line(w){ ctx.lineWidth = w || 3; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; }
function dot(x, y, r){ ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }

const SW = 110, SH = SW * 104 / 240;
const imgLine = new Image(), imgMask = new Image();
imgLine.src = IMG_LINE; imgMask.src = IMG_MASK;
const skinCache = {};
function skin(col){
  if (skinCache[col]) return skinCache[col];
  if (!imgLine.complete || !imgMask.complete) return null;
  const c = document.createElement('canvas'); c.width = 240; c.height = 104;
  const g = c.getContext('2d');
  g.drawImage(imgMask, 0, 0);
  g.globalCompositeOperation = 'source-in'; g.fillStyle = col; g.fillRect(0, 0, 240, 104);
  g.globalCompositeOperation = 'source-over'; g.drawImage(imgLine, 0, 0);
  return (skinCache[col] = c);
}

const Snd = {
  ac:null, master:null, bgm:null, sfx:null, noiseBuf:null, on:true, playing:false, step:0, nextT:0, timer:null,
  init(){
    if (this.ac){ this.ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ac = this.ac = new AC();
    this.master = ac.createGain(); this.master.gain.value = this.on ? 0.8 : 0; this.master.connect(ac.destination);
    this.bgm = ac.createGain(); this.bgm.gain.value = 0.32; this.bgm.connect(this.master);
    this.sfx = ac.createGain(); this.sfx.gain.value = 0.75; this.sfx.connect(this.master);
    const len = ac.sampleRate * 0.5, b = ac.createBuffer(1, len, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = b;
  },
  setOn(v){
    this.on = v;
    if (this.master) this.master.gain.setTargetAtTime(v ? 0.8 : 0, this.ac.currentTime, 0.02);
    try { localStorage.setItem('yurayura-sound', v ? '1' : '0'); } catch(e) {}
  },
  tone(f, t, dur, o = {}){
    const ac = this.ac, osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t + dur);
    const v = o.vol ?? 0.3, a = o.attack ?? 0.005;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(o.dest || this.sfx);
    osc.start(t); osc.stop(t + dur + 0.05);
  },
  noise(t, dur, o = {}){
    const ac = this.ac, src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = this.noiseBuf; f.type = o.ftype || 'bandpass'; f.frequency.setValueAtTime(o.freq || 1200, t);
    if (o.fslide) f.frequency.exponentialRampToValueAtTime(o.fslide, t + dur);
    f.Q.value = o.q || 1;
    g.gain.setValueAtTime(o.vol || 0.2, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(o.dest || this.sfx);
    src.start(t); src.stop(t + dur + 0.05);
  },
  mtof: m => 440 * Math.pow(2, (m - 69) / 12),
  mallet(m, t, vol, dest){
    const f = this.mtof(m);
    this.tone(f, t, 0.55, { vol, dest });
    this.tone(f * 4, t, 0.07, { vol: vol * 0.22, dest });
  },
  // --- 効果音 ---
  play(name){
    if (!this.ac || !this.on) return;
    const t = this.ac.currentTime;
    switch (name){
      case 'dive':
        this.tone(620, t, 0.16, { slide: 240, vol: 0.25 });
        this.noise(t, 0.18, { freq: 900, fslide: 300, vol: 0.12 }); break;
      case 'surface':
        this.noise(t, 0.22, { freq: 500, fslide: 2400, vol: 0.14, q: 0.7 });
        this.tone(300, t, 0.12, { slide: 720, vol: 0.18 }); break;
      case 'gasp':
        this.tone(330, t, 0.12, { type: 'triangle', vol: 0.18 });
        this.tone(262, t + 0.14, 0.18, { type: 'triangle', vol: 0.18 }); break;
      case 'color':
        [72, 76, 79].forEach((m, i) => this.mallet(m, t + i * 0.07, 0.22)); break;
      case 'newcolor':
        [72, 76, 79, 84].forEach((m, i) => this.mallet(m, t + i * 0.07, 0.24)); break;
      case 'hawk':
        this.tone(1900, t, 0.28, { type: 'sawtooth', slide: 1100, vol: 0.05, attack: 0.02 }); break;
      case 'hit':
        this.tone(420, t, 0.45, { slide: 80, vol: 0.35 });
        this.tone(210, t + 0.05, 0.4, { type: 'triangle', slide: 60, vol: 0.2 });
        this.noise(t, 0.15, { freq: 400, vol: 0.2 }); break;
      case 'tap':
        this.tone(880, t, 0.06, { vol: 0.15 }); break;
      case 'best':
        [72, 76, 79, 84, 88].forEach((m, i) => this.mallet(m, t + 0.1 + i * 0.1, 0.24)); break;
    }
  },
  // --- BGM：6/8のゆったりしたマリンバ ---
  MEL: [76,0,79,0,76,74, 72,0,0,69,0,72, 69,0,72,0,74,0, 74,0,0,0,79,0,
        81,0,79,0,76,0, 76,0,74,72,0,0, 69,0,72,74,0,76, 74,0,0,0,0,0],
  ROOT: [48, 45, 41, 43, 48, 45, 41, 43],
  CHORD: [[60,64,67],[57,60,64],[57,60,65],[55,59,62],[60,64,67],[57,60,64],[57,60,65],[55,59,62]],
  STEP: 0.23,
  schedule(step, t){
    const bar = Math.floor(step / 6), s = step % 6, dest = this.bgm;
    const m = this.MEL[step]; if (m) this.mallet(m, t, 0.2, dest);
    if (s === 0){
      this.tone(this.mtof(this.ROOT[bar] - 12), t, 0.9, { type: 'triangle', vol: 0.28, dest });
      this.CHORD[bar].forEach(c => this.tone(this.mtof(c), t, 1.2, { type: 'triangle', vol: 0.045, attack: 0.08, dest }));
    }
    if (s === 3) this.tone(this.mtof(this.ROOT[bar] - 5), t, 0.6, { type: 'triangle', vol: 0.2, dest });
    if (s === 2 || s === 5) this.noise(t, 0.05, { ftype: 'highpass', freq: 6000, vol: 0.05, dest });
  },
  startBgm(){
    if (!this.ac || this.playing) return;
    this.playing = true; this.step = 0; this.nextT = this.ac.currentTime + 0.1;
    this.timer = setInterval(() => {
      while (this.nextT < this.ac.currentTime + 0.15){
        this.schedule(this.step, this.nextT);
        this.nextT += this.STEP; this.step = (this.step + 1) % this.MEL.length;
      }
    }, 25);
  },
  bgmLevel(v){ if (this.bgm) this.bgm.gain.setTargetAtTime(v, this.ac.currentTime, 0.2); },
};
try { Snd.on = localStorage.getItem('yurayura-sound') !== '0'; } catch(e) {}

// ===== 状態 =====
let state = 'title', t = 0, playT = 0, dist = 0, scroll = 0, speed = P.speed0;
let breath = 100, exhausted = false, holding = false;
let depth = 0, vy = 0, obs = [], spawnIn = 0, hitT = 0, bubbles = [], bubbleT = 0;
let colorIdx = 0, popT = 0, labelT = 0, newThisRun = [];
let best = 0, dex = [0];
try { best = Number(localStorage.getItem('yurayura-best')) || 0; } catch(e) {}
try { const d = JSON.parse(localStorage.getItem('yurayura-dex') || '[0]'); if (Array.isArray(d)) dex = d; } catch(e) {}
if (!dex.includes(0)) dex.push(0);

const clouds = [0,1,2].map(i => ({ x: 60 + i * 170, y: 110 + (i % 2) * 55, s: 0.8 + (i % 3) * 0.2, seed: i * 7 }));

function reset(){
  speed = P.speed0; dist = 0; breath = 100; exhausted = false;
  obs = []; spawnIn = 1.2; depth = 0; vy = 0; bubbles = []; playT = 0;
  colorIdx = 0; popT = 0; labelT = 0; newThisRun = [];
}

// ===== 障害物 =====
function pick(pool){
  const sum = pool.reduce((a, p) => a + p[1], 0); let r = Math.random() * sum;
  for (const p of pool){ if ((r -= p[1]) < 0) return p[0]; }
  return pool[0][0];
}
const rnd = (a, b) => a + Math.random() * (b - a);
const pickA = a => a[Math.floor(Math.random() * a.length)];
const BOATS = {
  row:     { w:56,  h:30, dy:-4,  spd:0.9 },
  fishing: { w:116, h:54, dy:-14, spd:1 },
  yacht:   { w:80,  h:64, dy:-22, spd:1.1 },
  ferry:   { w:220, h:66, dy:-16, spd:0.95 },
};
function mkBoat(v, x){
  const b = BOATS[v];
  return { k:'boat', v, x:x + b.w / 2 - 30, w:b.w, h:b.h, y:SURF + b.dy, spd:b.spd, ph:rnd(0, 6),
           col: pickA(v === 'fishing' ? ['#f3c75b', '#7cc4e8', '#ea7a64'] : v === 'yacht' ? ['#e8505b', '#2f55a8', '#3fae6f'] : ['#f3c75b', '#e8505b']) };
}
function mkGull(x){
  const s = rnd(0.8, 1.3);
  return { k:'gull', x, s, w:34*s, h:22*s, y:SURF - 18 - 6*s, spd:rnd(1, 1.45), ph:rnd(0, 6), col:pickA(['#ffffff', '#dfe3e6', '#f5efe2']) };
}
function mkJelly(x, deep){
  const s = rnd(0.8, 1.25);
  return { k:'jelly', x, s, w:28*s, h:32*s, y:deep ? SURF + 122 : SURF + 58, spd:rnd(0.95, 1.05), ph:rnd(0, 6), col:pickA(['#ff9fcb', '#c7a4ff', '#9fe0ff']) };
}
function spawn(){
  const x = W + 70, lvl = Math.min(1, dist / 1500);
  const pool = [['gull', 3], ['fishing', 1.5], ['row', 1], ['deep', 2], ['shallow', 1.5]];
  pool.push(['cinnamon', 1.3], ['renkon', 1.2]);
  if (dist > 50)  pool.push(['onion', 1.3]);
  if (dist > 120) pool.push(['slice', 1]);
  if (dist > 60)  pool.push(['yacht', 1.2]);
  if (dist > 80)  pool.push(['swallow', 1.5]);
  if (dist > 100) pool.push(['fish', 2]);
  if (dist > 150) pool.push(['combo', 1 + lvl * 2]);
  if (dist > 200) pool.push(['hawk', 1.6]);
  if (dist > 250) pool.push(['ferry', 1 + lvl]);
  const k = pick(pool);
  if (k === 'gull') obs.push(mkGull(x));
  else if (k === 'deep') obs.push(mkJelly(x, true));
  else if (k === 'shallow') obs.push(mkJelly(x, false));
  else if (k === 'combo'){ const g = mkGull(x); obs.push(g, Object.assign(mkJelly(x, true), { spd:g.spd })); }
  else if (BOATS[k]) obs.push(mkBoat(k, x));
  else if (k === 'swallow') obs.push({ k:'swallow', x, w:34, h:20, y:SURF - 20, spd:rnd(1.6, 1.8), ph:rnd(0, 6) });
  else if (k === 'fish'){
    const n = 2 + Math.floor(Math.random() * 4), pos = [];
    for (let i = 0; i < n; i++) pos.push([(i - (n - 1) / 2) * 18, (i % 2 ? 5 : -5) + rnd(-2, 2)]);
    obs.push({ k:'fish', x, w:18 * n + 12, h:26, y:SURF + rnd(74, 86), spd:rnd(1.2, 1.6), ph:rnd(0, 6), pos,
               col:pickA(['#ff6d3f', '#ffd23f', '#3f8cff']) });
  }
  else if (k === 'cinnamon'){ const n = Math.random() < 0.4 ? 2 : 1, len = rnd(60, 90);
    obs.push({ k:'cinnamon', x, n, w:len, h:12 * n + 4, y:SURF - 2 - (n - 1) * 5, spd:1, ph:rnd(0, 6) }); }
  else if (k === 'onion') obs.push({ k:'onion', x, w:30, h:34, y:SURF, spd:1, ph:rnd(0, 6) });
  else if (k === 'renkon') obs.push({ k:'renkon', x, w:100, h:24, y:SURF + 122, spd:1, ph:rnd(0, 6) });
  else if (k === 'slice') obs.push({ k:'slice', x, w:30, h:30, y:SURF + 58, spd:rnd(1.05, 1.2), ph:rnd(0, 6) });
  else if (k === 'hawk') obs.push({ k:'hawk', x:x + 40, w:40, h:24, y:SURF - 170, cy:SURF - 170, spd:1.25, ph:rnd(0, 6) });
  const long = obs.length && obs[obs.length - 1].w > 150 ? 0.5 : 0;
  spawnIn = (lerp(1.7, 0.95, lvl) * (0.8 + Math.random() * 0.5) + long) * P.spawnGap;
}
function obsY(o){
  if (o.k === 'jelly') return o.y + Math.sin(t * 2 + o.ph) * 12;
  if (o.k === 'fish') return o.y + Math.sin(t * 3 + o.ph) * 8;
  if (o.k === 'hawk') return o.cy;
  if (o.k === 'onion') return o.y + Math.sin(t * 1.8 + o.ph) * 34;
  if (o.k === 'renkon') return o.y + Math.sin(t * 1.5 + o.ph) * 6;
  if (o.k === 'slice') return o.y + Math.sin(t * 2.2 + o.ph) * 12;
  if (o.k === 'swallow') return o.y + Math.sin(t * 4 + o.ph) * 12;
  return o.y;
}
function obsBox(o){
  const cy = obsY(o);
  return { l:o.x - o.w/2 + 3, r:o.x + o.w/2 - 3, t:cy - o.h/2 + 3, b:cy + o.h/2 - 3 };
}
function whaleBox(){
  const x = WX(), y = SURF + depth;
  return { l:x - 30, r:x + 32, t:y - 32, b:y + 2 };
}
const hit = (a, b) => a.l < b.r && a.r > b.l && a.t < b.b && a.b > b.t;

// ===== 更新 =====
function update(dt){
  t += dt;
  boilT += dt; if (boilT > 0.13){ boilT = 0; boil = (boil + 1) % 3; }
  if (state === 'hit'){ hitT -= dt; if (hitT <= 0) gameOver(); return; }
  const sp = state === 'play' ? speed : 60;
  scroll += sp * dt;
  clouds.forEach(c => { c.x -= sp * 0.12 * dt; if (c.x < -80) c.x = W + 80; });
  if (state !== 'play') return;

  playT += dt;
  speed = Math.min(P.speedMax, speed + P.speedGain * dt);
  dist += speed * dt / 40;

  const ci = Math.min(COLORS.length - 1, Math.floor(dist / P.colorStep));
  if (ci !== colorIdx){
    colorIdx = ci; popT = 0.45; labelT = 1.4;
    if (!dex.includes(ci)){ dex.push(ci); newThisRun.push(ci); saveDex(); Snd.play('newcolor'); }
    else Snd.play('color');
  }
  popT = Math.max(0, popT - dt); labelT = Math.max(0, labelT - dt);

  const diving = holding && !exhausted;
  if (diving && depth < 2 && vy <= 0) Snd.play('dive');
  if (diving) vy = Math.min(P.maxV, vy + P.sinkAcc * dt);
  else vy = Math.max(-P.maxV * 1.2, vy - P.riseAcc * dt);
  const prevDepth = depth;
  depth += vy * dt;
  if (depth < 0){ depth = 0; vy = 0; }
  if (prevDepth > P.submerged && depth <= P.submerged && vy < 0) Snd.play('surface');
  if (depth > P.maxDepth){ depth = P.maxDepth; vy = Math.min(vy, 0); }

  if (depth > P.submerged){
    breath -= P.drain * dt;
    if (breath <= 0 && !exhausted){ breath = 0; exhausted = true; Snd.play('gasp'); }
    bubbleT -= dt;
    if (bubbleT <= 0){ bubbleT = 0.18; bubbles.push({ x:WX() + 24, y:SURF + depth - 20, r:2 + Math.random() * 3 }); }
  } else {
    breath = Math.min(100, breath + P.refill * dt);
    if (exhausted && breath >= P.unlock) exhausted = false;
  }
  bubbles.forEach(b => { b.y -= 60 * dt; b.x -= speed * 0.5 * dt; });
  bubbles = bubbles.filter(b => b.y > SURF + 4);

  spawnIn -= dt; if (spawnIn <= 0) spawn();
  obs.forEach(o => {
    o.x -= speed * (o.spd || 1) * dt;
    if (o.k === 'hawk'){
      const dx = o.x - WX(), high = SURF - 170, low = SURF + 16;
      if (!o.cried && dx < 260){ o.cried = true; Snd.play('hawk'); }
      o.cy = dx > 0 ? lerp(high, low, ease(clamp01((230 - dx) / 230))) : lerp(low, high, clamp01(-dx / 160));
    }
  });
  obs = obs.filter(o => o.x + o.w > -80);

  const wb = whaleBox();
  for (const o of obs){
    if (hit(wb, obsBox(o))){
      state = 'hit'; hitT = 0.6; holding = false;
      Snd.play('hit'); Snd.bgmLevel(0.1);
      if (navigator.vibrate) navigator.vibrate(60);
      break;
    }
  }
}
function saveDex(){ try { localStorage.setItem('yurayura-dex', JSON.stringify(dex)); } catch(e) {} }

function drawCinnamon(o){
  const sd = o.ph * 10;
  ctx.save(); ctx.translate(o.x, SURF + Math.sin(t * 2 + o.ph) * 2);
  for (let i = 0; i < o.n; i++){
    const yy = -i * 11, dx = i * 8, L = o.w;
    new Sk(sd + i).rect(-L / 2 + dx, yy - 6, L - 8, 12).fill('#b5652e').stroke(2.5);
    new Sk(sd + i + 3).moveTo(-L / 2 + dx + 10, yy - 1).lineTo(-L / 2 + dx + L * 0.4, yy - 1)
      .moveTo(-L / 2 + dx + L * 0.5, yy + 2).lineTo(L / 2 + dx - 20, yy + 2).stroke(1.6);
    new Sk(sd + i + 6).ellipse(L / 2 + dx - 8, yy, 5, 6).fill('#d9924f').stroke(2.5);
    new Sk(sd + i + 9).moveTo(L / 2 + dx - 8, yy).quad(L / 2 + dx - 5, yy - 3, L / 2 + dx - 9, yy - 4).stroke(1.5);
  }
  ctx.restore();
}
function drawOnion(o){
  const cy = obsY(o), sd = o.ph * 10;
  ctx.save(); ctx.translate(o.x, cy); ctx.rotate(Math.sin(t * 1.8 + o.ph) * 0.2);
  new Sk(sd).moveTo(0, -17).quad(3, -25, -2, -29).stroke(2.5);
  new Sk(sd + 1).moveTo(-3, 15).lineTo(-6, 21).moveTo(0, 16).lineTo(0, 22).moveTo(3, 15).lineTo(6, 21).stroke(1.8);
  new Sk(sd + 2).moveTo(0, -17).bez(14, -10, 17, 6, 0, 15).bez(-17, 6, -14, -10, 0, -17).close().fill('#eaa23a').stroke(3);
  new Sk(sd + 3).moveTo(0, -14).quad(8, 0, 0, 13).moveTo(0, -14).quad(-8, 0, 0, 13).stroke(1.6);
  ctx.restore();
}
function drawRenkon(o){
  const cy = obsY(o), sd = o.ph * 10;
  ctx.save(); ctx.translate(o.x, cy);
  [34, 2, -30].forEach((sx, i) => {
    new Sk(sd + i).ellipse(sx, 0, 18, 12).fill('#f5c77e').stroke(3);
  });
  new Sk(sd + 4).ellipse(-47, 0, 7, 12).fill('#fff3dc').stroke(2.5);
  [[-47, -6], [-45, -1], [-47, 5], [-49, 0]].forEach(([hx, hy]) => dot(hx, hy, 1.6));
  new Sk(sd + 5).moveTo(18, -5).lineTo(18, 5).moveTo(-14, -5).lineTo(-14, 5).stroke(1.6);
  ctx.restore();
}
function drawSlice(o){
  const cy = obsY(o), sd = o.ph * 10;
  ctx.save(); ctx.translate(o.x, cy); ctx.rotate(t * 1.5 + o.ph);
  new Sk(sd).ellipse(0, 0, 15, 15).fill('#f8eedb').stroke(3);
  for (let i = 0; i < 7; i++){
    const a = i / 7 * Math.PI * 2;
    ctx.beginPath(); ctx.arc(Math.cos(a) * 8.5, Math.sin(a) * 8.5, 2.8, 0, 7); ctx.fillStyle = 'rgba(120,196,222,0.9)'; ctx.fill(); line(1.4); ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(0, 0, 3, 0, 7); ctx.fillStyle = 'rgba(120,196,222,0.9)'; ctx.fill(); line(1.4); ctx.stroke();
  ctx.restore();
}

function drawWhale(x, y, col, sc){
  const img = skin(col); if (!img) return;
  ctx.save(); ctx.translate(x, y); ctx.scale(-sc, sc);
  ctx.rotate((boil - 1) * 0.008);
  ctx.drawImage(img, -34, -SH + 5, SW, SH);
  ctx.restore();
}

const waveY = x => SURF + Math.sin((x + scroll) * 0.035 + t * 2.4) * 3 + Math.sin((x + scroll) * 0.012 - t * 1.2) * 2;

function drawBreath(){
  const full = breath >= 99.9 && depth <= P.submerged && !exhausted;
  const cx = W - WX() + 12, cy = Math.max(62, SURF + depth - 62);
  const n = 5, gap = 17, x0 = cx - gap * (n - 1) / 2, blink = exhausted && Math.floor(t * 6) % 2 === 0;
  ctx.globalAlpha = full ? 0.3 : 1;
  for (let i = 0; i < n; i++){
    const v = clamp01(breath / (100 / n) - i), x = x0 + i * gap, bob = Math.sin(t * 3 + i) * 1.5;
    ctx.beginPath(); ctx.arc(x, cy + bob, 7, 0, 7);
    ctx.setLineDash(v > 0 ? [] : [3, 3]); ctx.lineWidth = 2; ctx.strokeStyle = exhausted ? (blink ? '#f39aa0' : '#e8505b') : INK; ctx.stroke();
    ctx.setLineDash([]);
    if (v > 0){
      ctx.beginPath(); ctx.arc(x, cy + bob, 6 * Math.sqrt(v), 0, 7); ctx.fillStyle = '#fff'; ctx.fill();
      ctx.beginPath(); ctx.arc(x - 2, cy + bob - 2, 1.6 * v, 0, 7); ctx.fillStyle = '#78c4de'; ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}
function drawHUD(){
  ctx.fillStyle = INK; ctx.textBaseline = 'alphabetic';
  ctx.font = '600 24px "Klee One", sans-serif'; ctx.textAlign = 'left';
  ctx.fillText(Math.floor(dist) + ' m', 16, 36);
  ctx.font = '14px "Klee One", sans-serif';
  ctx.fillText('ベスト ' + best + ' m', 16, 56);

  ctx.fillStyle = INK;
  if (labelT > 0 && colorIdx > 0){
    ctx.globalAlpha = Math.min(1, labelT * 2);
    ctx.textAlign = 'center'; ctx.font = '600 22px "Klee One", sans-serif';
    const isNew = newThisRun.includes(colorIdx);
    ctx.fillText(COLORS[colorIdx][0] + 'の姿に' + (isNew ? '　はじめて！' : ''), W / 2, SURF + 190);
    ctx.globalAlpha = 1;
  }
  if (playT < 3 && labelT <= 0){
    ctx.globalAlpha = Math.min(1, 3 - playT);
    ctx.textAlign = 'center'; ctx.font = '600 18px "Klee One", sans-serif';
    ctx.fillText('長押しで潜る', W / 2, SURF + 190);
    ctx.globalAlpha = 1;
  }
}

function draw(){
  ctx.save();
  if (state === 'hit') ctx.translate((Math.random() - .5) * 8, (Math.random() - .5) * 8);
  ctx.fillStyle = PAPER; ctx.fillRect(-10, -10, W + 20, H + 20);
  ctx.save(); ctx.translate(W, 0); ctx.scale(-1, 1);   // 世界を左右反転（左へ進む）
  clouds.forEach(drawCloud);

  obs.forEach(o => { if (o.k === 'jelly') drawJelly(o); else if (o.k === 'fish') drawFish(o); else if (o.k === 'renkon') drawRenkon(o); else if (o.k === 'slice') drawSlice(o); });
  const wx = WX(), bob = depth < 2 ? (waveY(wx) - SURF) : 0;
  const sc = 1 + Math.sin((0.45 - popT) / 0.45 * Math.PI) * 0.18 * (popT > 0 ? 1 : 0);
  drawWhale(wx, SURF + depth + bob, COLORS[colorIdx][1], sc);
  obs.forEach(o => { if (o.k === 'boat') drawBoat(o); else if (o.k === 'cinnamon') drawCinnamon(o); else if (o.k === 'onion') drawOnion(o); });

  ctx.beginPath(); ctx.moveTo(-10, H + 10);
  for (let x = -10; x <= W + 10; x += 6) ctx.lineTo(x, waveY(x));
  ctx.lineTo(W + 10, H + 10); ctx.closePath();
  ctx.fillStyle = 'rgba(120,196,222,0.46)'; ctx.fill();
  ctx.fillStyle = 'rgba(70,150,190,0.16)'; ctx.fillRect(-10, SURF + 100, W + 20, H);
  ctx.beginPath();
  for (let x = -10; x <= W + 10; x += 6){ x === -10 ? ctx.moveTo(x, waveY(x)) : ctx.lineTo(x, waveY(x)); }
  line(3.5); ctx.stroke();

  bubbles.forEach(b => { ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); line(1.8); ctx.stroke(); });
  obs.forEach(o => { if (o.k === 'gull') drawGull(o); else if (o.k === 'swallow') drawSwallow(o); else if (o.k === 'hawk') drawHawk(o); });
  ctx.restore();

  if (state === 'play' || state === 'hit'){ drawBreath(); drawHUD(); }
  ctx.restore();
}

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ===== リザルト画像 =====
const logoImg = $('logoImg');
let cardBlob = null;
function renderCard(d, isBest){
  const CW = 1080, CH = 1350, c = document.createElement('canvas'); c.width = CW; c.height = CH;
  const g = c.getContext('2d');
  g.fillStyle = PAPER; g.fillRect(0, 0, CW, CH);
  if (logoImg.complete) g.drawImage(logoImg, 50, 50, 360, 360 * 463 / 560);

  g.fillStyle = INK; g.textAlign = 'right'; g.textBaseline = 'alphabetic';
  g.font = '600 170px "Klee One", sans-serif';
  g.fillText(d + ' m', CW - 70, 260);
  g.font = '600 46px "Klee One", sans-serif';
  g.fillText(isBest ? 'ベスト更新！' : 'ベスト ' + best + ' m', CW - 76, 340);

  const wl = 760, wave = x => wl + Math.sin(x * 0.012) * 12 + Math.sin(x * 0.031) * 5, bandY = 1140;
  const whale = skin(COLORS[colorIdx][1]);
  if (whale) g.drawImage(whale, CW / 2 - 300, wl - 259 + 14, 600, 260);
  g.beginPath(); g.moveTo(0, bandY);
  for (let x = 0; x <= CW; x += 8) g.lineTo(x, wave(x));
  g.lineTo(CW, bandY); g.closePath(); g.fillStyle = 'rgba(120,196,222,0.55)'; g.fill();
  g.beginPath(); for (let x = 0; x <= CW; x += 8){ x ? g.lineTo(x, wave(x)) : g.moveTo(x, wave(x)); }
  g.lineWidth = 9; g.strokeStyle = INK; g.lineCap = 'round'; g.stroke();

  g.textAlign = 'center'; g.fillStyle = INK; g.font = '600 58px "Klee One", sans-serif';
  g.fillText('「' + COLORS[colorIdx][0] + '」の姿に なられた', CW / 2, 920);
  const n = COLORS.length, gap = 58, x0 = CW / 2 - gap * (n - 1) / 2;
  COLORS.forEach((cl, i) => {
    g.beginPath(); g.arc(x0 + i * gap, 1030, 19, 0, 7);
    if (i <= colorIdx){ g.fillStyle = i === n - 1 ? '#eef6f9' : cl[1]; g.fill(); }
    else { g.setLineDash([6, 6]); g.globalAlpha = 0.35; }
    g.lineWidth = 5; g.strokeStyle = INK; g.stroke(); g.globalAlpha = 1; g.setLineDash([]);
  });

  // 知らない人向けの帯：どこで遊べるか
  g.fillStyle = INK; g.fillRect(0, bandY, CW, CH - bandY);
  g.fillStyle = '#fff'; g.font = '600 54px "Klee One", sans-serif';
  g.fillText('ゆらゆら様と、どこまで行ける？', CW / 2, bandY + 92);
  g.font = '40px "Klee One", sans-serif';
  g.fillText('遊ぶには ' + SHOP_IG + ' のプロフィールから', CW / 2, bandY + 164);

  cardBlob = null;
  c.toBlob(b => { cardBlob = b; }, 'image/png');
  return c.toDataURL('image/png');
}
function caption(){
  return 'ゆらゆら様は ' + Math.floor(dist) + 'm 進まれ、「' + COLORS[colorIdx][0] + '」の姿になられた🐋\n遊ぶには ' + SHOP_IG + ' のプロフィールから\n#ゆらゆら伝説';
}
async function shareCard(){
  if (cardBlob && navigator.canShare){
    const file = new File([cardBlob], 'yurayura.png', { type: 'image/png' });
    if (navigator.canShare({ files: [file] })){
      try { await navigator.share({ files: [file] }); return; }
      catch(e){ if (e.name === 'AbortError') return; }
    }
  }
  $('shareNote').textContent = 'この端末では直接シェアできないので、画像を長押しで保存してインスタに投稿してください';
}
async function copyCaption(){
  const text = caption();
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch(e) {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch(_) {}
    ta.remove();
  }
  $('shareNote').textContent = ok ? '投稿文をコピーしました。インスタのキャプションに貼り付けてください' : 'コピーできませんでした';
}

function gameOver(){
  state = 'over';
  const d = Math.floor(dist), isBest = d > best && d > 0;
  if (d > best){ best = d; try { localStorage.setItem('yurayura-best', String(best)); } catch(e) {} }
  $('card').src = renderCard(d, isBest);
  $('newText').textContent = newThisRun.length ? '図鑑に ' + newThisRun.length + '色 追加' : '';
  $('shareNote').textContent = '画像は長押しでも保存できます';
  $('over').classList.remove('hidden');
  if (isBest) Snd.play('best');
  renderDex();
}

function renderDex(){
  $('dexCount').textContent = '集めた色 ' + dex.length + ' / ' + COLORS.length;
  $('dexDots').innerHTML = '';
  COLORS.forEach((c, i) => {
    const el = document.createElement('span');
    el.className = 'dot' + (dex.includes(i) ? '' : ' off');
    if (dex.includes(i)) el.style.background = i === COLORS.length - 1 ? '#eef6f9' : c[1];
    el.title = dex.includes(i) ? c[0] : '？';
    $('dexDots').appendChild(el);
  });
}
renderDex();

// ===== 入力 =====
wrap.addEventListener('pointerdown', e => {
  if (state === 'play' && !e.target.closest('button, a')){ holding = true; e.preventDefault(); }
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => addEventListener(ev, () => { holding = false; }));
addEventListener('keydown', e => { if (e.code === 'Space'){ e.preventDefault(); if (state === 'play') holding = true; } });
addEventListener('keyup', e => { if (e.code === 'Space') holding = false; });
cvs.addEventListener('contextmenu', e => e.preventDefault());

function start(){
  Snd.init(); Snd.play('tap'); Snd.startBgm(); Snd.bgmLevel(0.32);
  $('title').classList.add('hidden'); $('over').classList.add('hidden');
  reset(); state = 'play';
}
$('startBtn').addEventListener('click', start);
function syncSoundBtns(){ document.querySelectorAll('.snd').forEach(b => { b.textContent = Snd.on ? '音：オン' : '音：オフ'; b.setAttribute('aria-pressed', Snd.on); }); }
document.querySelectorAll('.snd').forEach(b => b.addEventListener('click', () => { Snd.init(); Snd.setOn(!Snd.on); Snd.play('tap'); syncSoundBtns(); }));
syncSoundBtns();
$('retryBtn').addEventListener('click', start);
$('shareBtn').addEventListener('click', shareCard);
$('copyBtn').addEventListener('click', copyCaption);
</script>
</body>
